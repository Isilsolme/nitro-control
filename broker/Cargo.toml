[package]
name = "nitro-broker"
version.workspace = true
edition.workspace = true

[dependencies]
nitro-core = { path = "../core" }
serde_json = "1"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Pipes",
  "Win32_System_IO",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
] }
windows-service = "0.8"
