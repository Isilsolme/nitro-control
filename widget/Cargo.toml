[package]
name = "nitro-widget"
version.workspace = true
edition.workspace = true

[dependencies]
nitro-core = { path = "../core" }
serde_json = "1"
slint = { version = "1.18", default-features = false, features = [
  "std",
  "backend-winit",
  "renderer-software",
  "compat-1-2",
] }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_System_Services",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.18"
winres = "0.1"
